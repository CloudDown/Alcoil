name: no-binaries
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked executables
        run: |
          if git ls-files | grep -Ei '\.(exe|dll|bin)$'; then
            echo "binaries should not be tracked" >&2
            exit 1
          fi
